<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Threads 乾淨連結工具</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="bg-white text-gray-900 font-sans min-h-screen flex items-start justify-center px-4 py-12">
  <div
    x-data="cleaner()"
    class="w-full max-w-lg bg-white border border-gray-200 rounded-2xl p-8"
  >
    <h1 class="text-lg font-semibold mb-1">Threads 乾淨連結工具</h1>
    <p class="text-sm text-gray-500 leading-relaxed mb-6">
      貼上 Threads 的 <code>/share/xxx</code> 分享連結，或瀏覽器打開後網址列的完整網址，
      一鍵去掉帳號追蹤碼並複製。
    </p>

    <label for="input" class="block text-xs text-gray-500 mb-1.5">網址</label>
    <textarea
      id="input"
      x-model="raw"
      @keydown.cmd.enter="convert()"
      @keydown.ctrl.enter="convert()"
      placeholder="https://www.threads.com/share/xxxxxxx/ 或 https://www.threads.com/@user/post/xxxxxxx?xmt=..."
      class="w-full min-h-[90px] p-3 rounded-lg border border-gray-200 bg-white text-sm resize-y focus:outline-none focus:ring-2 focus:ring-gray-300"
    ></textarea>

    <button
      @click="convert()"
      :disabled="loading"
      class="mt-3 w-full py-3 rounded-lg bg-black text-white text-sm font-semibold hover:bg-gray-800 active:opacity-80 disabled:opacity-50"
    >
      <span x-text="loading ? '解析中…' : '轉換並複製'"></span>
    </button>

    <div x-show="result" x-cloak class="mt-5">
      <div class="flex items-center gap-2 p-3 rounded-lg border border-gray-200 bg-gray-50 text-sm break-all">
        <code class="flex-1" x-text="result"></code>
        <button
          @click="copyAgain()"
          class="shrink-0 px-3 py-1.5 rounded-lg bg-black text-white text-xs font-semibold hover:bg-gray-800"
        >
          再複製一次
        </button>
      </div>
      <div
        class="mt-2 text-sm"
        :class="statusOk ? 'text-green-600' : 'text-red-600'"
        x-text="status"
      ></div>
    </div>

    <div class="mt-5 text-xs text-gray-400 leading-relaxed">
      <code>/share/xxx</code> 短連結會經由一個小型 Cloudflare Worker 解析成完整網址，
      不需要在瀏覽器打開過一次；也因此不會受到 Threads 前端有時把網址列洗掉的問題影響。
    </div>
  </div>

<script>
  const RESOLVER_URL = 'https://threads-link-resolver.ad80352.workers.dev';

  function cleaner() {
    return {
      raw: '',
      result: '',
      status: '',
      statusOk: false,
      loading: false,

      isShareLink(url) {
        try {
          const u = new URL(url.trim());
          return /threads\.(com|net)$/.test(u.hostname) && u.pathname.startsWith('/share/');
        } catch (e) {
          return false;
        }
      },

      clean(url) {
        try {
          const u = new URL(url.trim());
          u.search = '';
          u.hash = '';
          return u.toString();
        } catch (e) {
          return null;
        }
      },

      async resolveShareLink(url) {
        const resp = await fetch(`${RESOLVER_URL}?url=${encodeURIComponent(url.trim())}`);
        const data = await resp.json();
        if (!resp.ok || !data.clean) {
          throw new Error(data.error || '解析失敗');
        }
        return data.clean;
      },

      async copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (e) {
          return false;
        }
      },

      async convert() {
        const raw = this.raw;

        if (this.isShareLink(raw)) {
          this.loading = true;
          this.result = '';
          this.status = '';
          try {
            const cleaned = await this.resolveShareLink(raw);
            this.result = cleaned;
            const ok = await this.copyText(cleaned);
            this.status = ok ? '已複製到剪貼簿！' : '轉換完成，但自動複製失敗，請手動複製上面的網址。';
            this.statusOk = ok;
          } catch (e) {
            this.status = `解析短連結失敗：${e.message}`;
            this.statusOk = false;
          } finally {
            this.loading = false;
          }
          return;
        }

        const cleaned = this.clean(raw);
        if (!cleaned) {
          this.result = '';
          this.status = '看起來不是有效的網址，請確認貼上的內容。';
          this.statusOk = false;
          return;
        }
        this.result = cleaned;
        const ok = await this.copyText(cleaned);
        this.status = ok ? '已複製到剪貼簿！' : '轉換完成，但自動複製失敗，請手動複製上面的網址。';
        this.statusOk = ok;
      },

      async copyAgain() {
        const ok = await this.copyText(this.result);
        this.status = ok ? '已複製到剪貼簿！' : '複製失敗，請手動複製。';
        this.statusOk = ok;
      },
    };
  }
</script>
</body>
</html>
