<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Threads 乾淨連結工具 - 一鍵移除追蹤碼 (xmt)</title>
<meta name="description" content="免費線上工具，一鍵移除 Threads 貼文網址與分享連結中的 xmt 追蹤碼、帳號資訊，貼上網址即可轉換成乾淨連結。" />
<link rel="canonical" href="https://ad80352.github.io/threads-link-cleaner/" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Threads 乾淨連結工具 - 一鍵移除追蹤碼" />
<meta property="og:description" content="免費線上工具，一鍵移除 Threads 貼文網址與分享連結中的 xmt 追蹤碼、帳號資訊。" />
<meta property="og:url" content="https://ad80352.github.io/threads-link-cleaner/" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Threads 乾淨連結工具",
  "url": "https://ad80352.github.io/threads-link-cleaner/",
  "description": "免費線上工具，一鍵移除 Threads 貼文網址與分享連結中的 xmt 追蹤碼、帳號資訊。",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TWD" }
}
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="bg-white text-gray-900 font-sans min-h-screen flex items-start justify-center px-4 py-12">
  <div
    x-data="cleaner()"
    class="w-full max-w-lg bg-white border border-gray-200 rounded-2xl p-8"
  >
    <h1 class="text-lg font-semibold mb-1">Threads 乾淨連結工具</h1>
    <p class="text-sm text-gray-500 mb-1">移除網址裡的 <code class="text-red-600 font-mono">?xmt=...</code> 追蹤碼</p>
    <p class="text-sm text-gray-500 leading-relaxed mb-6">
      貼上 Threads 的 <code>/share/xxx</code> 分享連結，或瀏覽器打開後網址列的完整網址，
      一鍵去掉帳號追蹤碼。
    </p>

    <div class="flex items-center justify-between mb-1.5">
      <label for="input" class="text-xs font-medium text-gray-700">網址</label>
      <button
        @click="clearAll()"
        type="button"
        x-show="raw"
        x-cloak
        class="inline-flex items-center gap-1 text-xs font-medium text-gray-500 hover:text-gray-800"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
        清除
      </button>
    </div>
    <textarea
      id="input"
      x-model="raw"
      @input="errorMsg = ''"
      @keydown.cmd.enter="convert()"
      @keydown.ctrl.enter="convert()"
      placeholder="https://www.threads.com/@user/post/xxxxxxx?xmt=..."
      class="w-full min-h-[90px] p-3 rounded-lg border bg-white text-sm resize-y
             transition-colors duration-150 focus:outline-none focus:ring-2
             focus:ring-offset-1"
      :class="hasError
        ? 'border-red-300 focus:ring-red-300 focus:border-red-400'
        : 'border-gray-300 focus:ring-gray-300 focus:border-gray-400'"
    ></textarea>

    <button
      @click="convert()"
      :disabled="loading"
      class="mt-5 w-full py-3 rounded-lg bg-black text-white text-sm font-semibold hover:bg-gray-800 active:opacity-80 disabled:opacity-50"
    >
      <span x-text="loading ? '解析中…' : '轉換'"></span>
    </button>

    <div x-show="errorMsg" x-cloak role="alert"
         class="mt-5 flex items-start gap-2 px-3 py-2 rounded-lg bg-red-50 border border-red-200">
      <span class="text-red-500 text-sm leading-5">⚠</span>
      <span class="text-sm text-red-700 leading-5" x-text="errorMsg"></span>
    </div>

    <div x-show="result" x-cloak class="mt-5">
      <div class="flex items-center flex-wrap gap-2 mb-1.5">
        <span class="inline-flex items-center gap-1 text-xs font-semibold text-green-700 bg-green-100 px-2 py-0.5 rounded-full">
          ✓ 已移除追蹤碼
        </span>
        <span x-show="status"
              class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full"
              :class="statusOk ? 'text-green-700 bg-green-100' : 'text-amber-700 bg-amber-100'"
              x-text="status"></span>
      </div>
      <div x-show="removedPart" class="text-xs text-gray-400 truncate mb-1.5" x-text="'刪除：' + removedPart"></div>
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 p-3 rounded-lg border border-gray-300 bg-gray-50 text-sm">
        <code class="flex-1 font-mono text-gray-900 break-all" x-text="result"></code>
        <button @click="copyAgain()"
                class="self-end sm:self-auto shrink-0 px-3 py-1.5 rounded-lg border border-gray-300 text-gray-700 text-xs font-semibold hover:bg-gray-100">
          複製
        </button>
      </div>
    </div>

    <div class="mt-5 text-xs text-gray-400 leading-relaxed">
      <code>/share/xxx</code> 短連結會經由一個小型 Cloudflare Worker 解析成完整網址，
      不需要在瀏覽器打開過一次；也因此不會受到 Threads 前端有時把網址列洗掉的問題影響。
    </div>
  </div>

<script>
  const RESOLVER_URL = 'https://threads-link-resolver.ad80352.workers.dev';

  function cleaner() {
    return {
      raw: '',
      result: '',
      removedPart: '',
      status: '',
      statusOk: false,
      loading: false,
      errorMsg: '',

      get hasError() {
        return !!this.errorMsg;
      },

      isThreadsHost(hostname) {
        return /(^|\.)threads\.(com|net)$/.test(hostname);
      },

      isShareLink(url) {
        try {
          const u = new URL(url.trim());
          return this.isThreadsHost(u.hostname) && u.pathname.startsWith('/share/');
        } catch (e) {
          return false;
        }
      },

      clean(url) {
        try {
          const u = new URL(url.trim());
          const removed = u.search + u.hash;
          u.search = '';
          u.hash = '';
          return { cleaned: u.toString(), removed };
        } catch (e) {
          return null;
        }
      },

      async resolveShareLink(url) {
        const resp = await fetch(`${RESOLVER_URL}?url=${encodeURIComponent(url.trim())}`);
        const data = await resp.json();
        if (!resp.ok || !data.clean) {
          throw new Error(data.error || '解析失敗');
        }
        return data.clean;
      },

      async copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (e) {
          return false;
        }
      },

      async convert() {
        const raw = this.raw;
        this.errorMsg = '';

        let parsed;
        try {
          parsed = new URL(raw.trim());
        } catch (e) {
          this.result = '';
          this.errorMsg = '看起來不是有效的網址，請確認貼上的內容。';
          return;
        }

        if (!this.isThreadsHost(parsed.hostname)) {
          this.result = '';
          this.errorMsg = '這不是 Threads 的網址，請貼上 threads.com 的分享連結或貼文網址。';
          return;
        }

        if (this.isShareLink(raw)) {
          this.loading = true;
          this.result = '';
          this.removedPart = '';
          this.status = '';
          try {
            this.result = await this.resolveShareLink(raw);
          } catch (e) {
            this.errorMsg = `解析短連結失敗：${e.message}`;
          } finally {
            this.loading = false;
          }
          return;
        }

        const result = this.clean(raw);
        this.result = result.cleaned;
        this.removedPart = result.removed;
        this.status = '';
      },

      async copyAgain() {
        const ok = await this.copyText(this.result);
        this.status = ok ? '✓ 已複製到剪貼簿' : '⚠ 請手動複製';
        this.statusOk = ok;
      },

      clearAll() {
        this.raw = '';
        this.result = '';
        this.removedPart = '';
        this.status = '';
        this.statusOk = false;
        this.errorMsg = '';
        document.getElementById('input').focus();
      },
    };
  }
</script>
</body>
</html>
